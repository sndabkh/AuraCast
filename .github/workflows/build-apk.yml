name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore and Environment Files
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          touch .env
          cp -n .env.example .env || true
          
          # Ensure debug.keystore exists (restore from base64 if needed)
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          ls -lh debug.keystore || true

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verify and Locate Generated APK
        run: |
          mkdir -p releases
          find app/build/outputs/apk/ -name "*.apk" -exec ls -lh {} +
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk releases/AuraCast-v1.0.apk
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraCast-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0' }}
          name: AuraCast v1.0
          draft: false
          prerelease: false
          body: |
            ## AuraCast APK Download / Скачать приложение
            
            ### 📥 Direct APK Download / Скачать файл:
            - **[AuraCast-v1.0.apk (Direct Download)](https://github.com/${{ github.repository }}/releases/download/v1.0/app-debug.apk)**
            
            ### ⚠️ Legal Disclaimer / Отказ от ответственности:
            - **EN**: Installing and using this software while operating a vehicle is strictly at the user's sole risk and liability. Developers bear zero responsibility.
            - **RU**: Установка и использование программы за рулем осуществляется исключительно под личную ответственность водителя.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
