name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraCast-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ github.ref_name }}
          name: AuraCast Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## AuraCast APK Download
            
            ### 📥 Скачать приложение
            - **[AuraCast.apk (Прямая ссылка)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-debug.apk)**
            
            ### ⚠️ Отказ от ответственности:
            Установка и использование программы осуществляется исключительно под личную ответственность водителя.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
